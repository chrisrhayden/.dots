# hypr config

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

xwayland {
  # force_zero_scaling = true
}


# $active_border = rgba(ffffffee)
# $inactive_border = rgba(595959aa)
$active_border = rgb(255,255,255)
$inactive_border = rgb(59,59,59)
$accent = rgb(223,106,136)
$font_family = Cartograph CF
$rounding = 5

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
# monitor=,preferred,auto,auto
# monitor=name,addreserved,TOP,BOTTOM,LEFT,RIGHT
# eww is 26px tall and hypr has 14px outside so we add 12px as reserved space
# monitor=,addreserved,0,24,0,0
# monitor=0,12,0,0
# monitor=,addreserved,0,12,0,0
# monitor=,addreserved,0,18,0,0
# monitor=,addreserved,0,18,0,0,0.9
# monitor = ,addreserved,0,18,0,0
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = eDP-1,addreserved,0,18,0,0

# Execute your favorite apps at launch
exec-once = hyprpaper
exec-once = hypridle
# exec-once = ags run --gtk 4
exec-once = dunst
exec-once = just --justfile ~/.dots/ok_shell/justfile run

env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,34

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf


ecosystem {
    no_update_news = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    # kb_options =
    kb_options = caps:none
    kb_rules =

    follow_mouse = 1

    touchpad {
        tap-to-click = false
        natural_scroll = no
        # scroll_factor = 0
    }

    # sensitivity = -0.9 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
}

group {
    col.border_active = $active_border
    col.border_inactive = $inactive_border

    groupbar {
        height = 1
        indicator_height = 20
        text_offset = -10
        keep_upper_gap = false
        rounding = $rounding
        round_only_edges = true

        font_family = $font_family
        font_size = 14
        font_weight_active = Bold
        font_weight_inactive = Bold

        text_color = rgb(0,0,0)
        text_color_locked_active = rgb(0,0,0)
        text_color_inactive = rgb(255,255,255)
        text_color_locked_inactive = $accent

        col.active = $active_border
        col.locked_active = $accent
        col.inactive = $inactive_border
        col.locked_inactive = $inactive_border
    }
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = $rounding

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        ignore_window = true
        color = rgba(1a1a1aee)
    }
}



animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {

    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # master switch for pseudotiling. Enabling is bound to mainMod + P in the
    # keybinds section below

    pseudotile = yes
    # you probably want this
    preserve_split = yes
}

binds {
    workspace_back_and_forth = true
    # allow_workspace_cycles = true
}

# Example windowrule v1
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = workspace 10 silent,class:^([sS]team.*)$
windowrulev2 = workspace 10 silent,title:^([sS]team.*)$
windowrulev2 = workspace 6 silent,title:^(.*Discord.*)$

# windowrule = match:title "bad light", float
windowrule = rounding 0, title:bad light

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, F1, exec, firefox
bind = $mainMod, F2, exec, firefox 'https://www.youtube.com/'
bind = $mainMod SHIFT, F2, exec, firefox --new-window 'https://www.youtube.com/'
bind = $mainMod, F3, exec, Steam
bind = $mainMod, w, killactive,
bind = $mainMod SHIFT, q, exit,
bind = $mainMod, Space, togglefloating,
# $runMenu = tofi-drun | xargs hyprctl dispatch exec --
# bind = $mainMod, Tab, exec, $runMenu
bind = $mainMod, e, togglesplit,
bind = $mainMod, f, fullscreen,
bind = $mainMod SHIFT, f, fullscreen, 1
bind = $mainMod SHIFT, m, movecurrentworkspacetomonitor, -1

bind = ALT, F1, exec, volume --mute
bind = ALT, F2, exec, volume --down
bind = ALT, F3, exec, volume --up

# group
bind = $mainMod, t, togglegroup
bind = $mainMod SHIFT, t, lockgroups, toggle
bind = $mainMod, r, changegroupactive
bind = $mainMod CTRL, h, changegroupactive, b
bind = $mainMod CTRL, l, changegroupactive, f

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, v, layoutmsg, preselect d
bind = $mainMod, b, layoutmsg, preselect r

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


bind = SUPER, TAB, global, quickshell:open_start_menu
