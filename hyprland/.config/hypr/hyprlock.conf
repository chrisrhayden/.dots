$font = Cartograph CF

general {
    # hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/WANEELLA/Horizon_Pt-2_5400x2700.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    # outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg

    outer_color = rgb(200, 200, 200)
    # check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    # fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    # https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    text = $TIME12
    font_size = 60
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 40
    position = 0, 60
    halign = center
    valign = center
}


label {
    monitor =
    text = shutdown
    font_family = $font
    font_size = 40
    position = -30, 30
    halign = right
    valign = right
    onclick = poweroff
}
